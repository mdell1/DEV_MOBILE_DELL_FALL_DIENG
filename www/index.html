<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC Calculator</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <div class="header">
        <h1>Calculateur IMC</h1>
        <p>Indice de Masse Corporelle</p>
    </div>

    <div class="card">
        <div class="input-group">
            <label>Poids</label>
            <div class="input-box">
                <input 
                    type="number" 
                    id="poids" 
                    placeholder="70"
                    inputmode="numeric"
                    onclick="this.focus()"
                    ontouchstart="this.focus()"
                >
                <span class="unit">kg</span>
            </div>
        </div>

        <div class="input-group">
            <label>Taille</label>
            <div class="input-box">
                <input 
                    type="number" 
                    id="taille" 
                    placeholder="175"
                    inputmode="numeric"
                    onclick="this.focus()"
                    ontouchstart="this.focus()"
                >
                <span class="unit">cm</span>
            </div>
        </div>

        <button onclick="calculerIMC()">Calculer mon IMC</button>
    </div>

    <div id="resultat" class="resultat" style="display:none">
        <div class="imc-number" id="imcNumber"></div>
        <div class="imc-label" id="imcLabel"></div>
        <button class="btn-reset" onclick="reset()">Recommencer</button>
    </div>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
