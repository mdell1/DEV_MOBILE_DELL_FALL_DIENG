<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gestion Contacts</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="header">
        <div class="header-left">
            <h1>Contacts</h1>
            <span id="counter" class="counter">0 contact</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="exportContacts()">&#8595; Export</button>
            <label class="icon-btn" for="importFile">&#8593; Import</label>
            <input type="file" id="importFile" accept=".json"
                   onchange="importContacts(event)" style="display:none">
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat">
            <span id="stat-total">0</span>
            <label>Total</label>
        </div>
        <div class="stat">
            <span id="stat-fav">0</span>
            <label>Favoris</label>
        </div>
        <div class="stat">
            <span id="stat-recent">0</span>
            <label>Aujourd'hui</label>
        </div>
    </div>

    <div class="container">

        <div class="form-card">
            <p class="form-title">Nouveau contact</p>
            <input type="text"  id="name"  placeholder="Nom complet" />
            <div class="row">
                <input type="tel"   id="phone" placeholder="Téléphone" />
                <input type="email" id="email" placeholder="Email" />
            </div>
            <button id="addBtn" onclick="addContact()">+ Ajouter le contact</button>
        </div>

        <div class="toolbar">
            <input type="text" id="search" class="search-bar"
                   placeholder="Rechercher..."
                   oninput="searchContact()" />
            <select id="sortSelect" onchange="sortContacts()">
                <option value="date">Récents</option>
                <option value="alpha">A → Z</option>
                <option value="fav">Favoris</option>
            </select>
        </div>

        <div id="contactList"></div>

    </div>

    <div id="toast" class="toast hidden"></div>

    <div id="modal-overlay" class="modal-overlay hidden"
         onclick="closeModalOverlay(event)">
        <div class="modal-box">
            <p class="form-title">Modifier le contact</p>
            <input type="text"  id="edit-name"  placeholder="Nom complet" />
            <input type="tel"   id="edit-phone" placeholder="Téléphone" />
            <input type="email" id="edit-email" placeholder="Email" />
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Annuler</button>
                <button class="btn-save"   onclick="saveEdit()">Enregistrer</button>
            </div>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
